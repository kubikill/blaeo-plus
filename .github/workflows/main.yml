name: Upload assets to tags

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: DerYeger/yarn-setup-action@master
        with:
          node-version: 18
      - run: yarn build
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
